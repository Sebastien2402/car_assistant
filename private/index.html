<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>Copilote</title>
<style>
  :root { color-scheme: dark; --bg:#0b0f14; --card:#141b24; --txt:#e8eef5; --muted:#8a97a8;
          --accent:#3b82f6; --rec:#ef4444; --ok:#22c55e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--txt); display: flex; flex-direction: column;
         height: 100vh; height: 100dvh; font: 16px/1.4 -apple-system, system-ui, sans-serif;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; }
  header h1 { font-size: 18px; margin: 0; }
  #gps { font-size: 13px; color: var(--muted); }
  #gps.ok { color: var(--ok); }

  #mapwrap { position: relative; flex: 1 1 auto; min-height: 0; background: #1b2430; }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; color: #111; }
  #info { position: absolute; top: 10px; left: 10px; z-index: 1000; max-width: 70%;
          background: rgba(11,15,20,.88); padding: 8px 12px; border-radius: 12px; font-weight: 600; font-size: 15px; }
  #tools { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
  #tools button { width: 44px; height: 44px; border-radius: 50%; border: none; background: #fff; color: #111;
                  font-size: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  #tools button.on { background: #2563eb; color: #fff; }
  #links { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 1000;
           display: flex; flex-direction: column; gap: 8px; }
  #links:empty { display: none; }
  .lhead { display: flex; justify-content: space-between; align-items: center; gap: 8px;
           background: rgba(11,15,20,.88); padding: 8px 12px; border-radius: 12px; font-size: 14px; }
  .lhead button { background: none; border: none; color: var(--muted); font-size: 18px; padding: 0 4px; }
  .lrow { display: flex; gap: 8px; }
  .btn { flex: 1; text-align: center; padding: 13px 8px; border-radius: 12px; background: var(--accent);
         color: #fff; text-decoration: none; font-weight: 600; font-size: 16px; }
  .pin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; color: #fff; font-weight: 700;
         display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .pin.start { background: #16a34a; } .pin.stop { background: #f59e0b; } .pin.end { background: #dc2626; }

  #log { flex: 0 0 auto; max-height: 20vh; overflow-y: auto; padding: 8px 14px; display: flex;
         flex-direction: column; gap: 6px; }
  #log:empty { display: none; }
  .msg { max-width: 90%; padding: 8px 12px; border-radius: 14px; background: var(--card); font-size: 15px; }
  .msg.user { align-self: flex-end; background: #1d3a66; }
  .msg.sys { align-self: center; color: var(--muted); font-size: 13px; background: none; text-align: center; }

  footer { padding: 10px 14px 12px; }
  .mainrow { display: flex; align-items: center; gap: 14px; }
  #mic { width: 72px; height: 72px; flex: 0 0 auto; border-radius: 50%; border: none; color: #fff;
         background: var(--accent); font-size: 32px; display: flex; align-items: center; justify-content: center;
         touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  body[data-state=recording] #mic { background: var(--rec); animation: pulse 1.2s infinite; }
  body[data-state=processing] #mic { background: #475569; }
  body[data-state=speaking] #mic { background: var(--ok); }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  #status { flex: 1; font-weight: 600; }
  #optbtn { background: none; border: 1px solid #2a3544; color: var(--muted); border-radius: 10px;
            width: 44px; height: 44px; font-size: 20px; }
  #options { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; color: var(--muted); font-size: 14px;
             max-height: 38vh; overflow-y: auto; }
  #options .row { display: flex; gap: 8px; align-items: center; }
  #reset { align-self: flex-start; background: none; border: 1px solid #2a3544; color: var(--muted);
           border-radius: 10px; padding: 8px 12px; font-size: 14px; }
  #tf { display: flex; gap: 8px; }
  #ti { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #2a3544; background: var(--card);
        color: var(--txt); font-size: 16px; }
  #tf button { padding: 10px 14px; border-radius: 10px; border: none; background: #2a3544; color: var(--txt); }

  #hist { display: flex; flex-direction: column; gap: 6px; }
  .hhead { color: var(--muted); font-size: 13px; }
  #histlist { display: flex; flex-direction: column; gap: 6px; }
  .hitem { text-align: left; background: var(--card); color: var(--txt); border: 1px solid #2a3544;
           border-radius: 10px; padding: 10px 12px; font-size: 15px; }
  #histclear { align-self: flex-start; background: none; border: none; color: var(--muted);
               font-size: 13px; text-decoration: underline; padding: 0; }
</style>
</head>
<body data-state="idle">
<header>
  <h1>Copilote</h1>
  <span id="gps">GPS …</span>
</header>

<div id="mapwrap">
  <div id="map"></div>
  <div id="info" hidden></div>
  <div id="tools">
    <button id="fit" type="button" aria-label="Voir tout l'itinéraire">⤢</button>
    <button id="follow" type="button" aria-label="Suivre ma position">◎</button>
  </div>
  <div id="links"></div>
</div>

<div id="log"></div>

<footer>
  <div class="mainrow">
    <button id="mic" type="button" aria-label="Parler">🎙</button>
    <div id="status">Appuyer pour parler</div>
    <button id="optbtn" type="button" aria-label="Options">⋯</button>
  </div>
  <div id="options" hidden>
    <label class="row"><input type="checkbox" id="hf"> Mains libres (relance l'écoute après chaque réponse)</label>
    <button id="reset" type="button">Nouvelle conversation</button>
    <a href="/logout" style="color:inherit">Verrouiller l'application</a>
    <div id="hist" hidden>
      <div class="hhead">Derniers trajets</div>
      <div id="histlist"></div>
      <button id="histclear" type="button">Effacer l'historique</button>
    </div>
    <form id="tf"><input id="ti" placeholder="Saisie au clavier (test)" autocomplete="off"><button>OK</button></form>
  </div>
</footer>
<audio id="player" playsinline></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
  const SILENCE_MS = 1100, NO_SPEECH_MS = 8000, MAX_MS = 15000;   // réglages de l'écoute
  const LABELS = { idle: "Appuyer pour parler", recording: "J'écoute… (toucher pour terminer)",
                   processing: "Je réfléchis…", speaking: "Je parle… (toucher pour couper)" };
  const PIN = { start: "A", stop: "★", end: "B" };

  const player = $("#player"), mic = $("#mic"), logEl = $("#log"), linksEl = $("#links");
  let state = "idle", unlocked = false, audioCtx = null, chain = Promise.resolve();
  let gps = null, watchId = null, rec = null, turnId = 0, abortCtl = null, ended = false;

  function setState(s) { state = s; document.body.dataset.state = s; $("#status").textContent = LABELS[s]; }
  function say(role, text) {
    const d = document.createElement("div");
    d.className = "msg " + role;
    d.textContent = text;
    logEl.append(d);
    logEl.scrollTop = logEl.scrollHeight;
    if (hasMap) setTimeout(() => map.invalidateSize(), 50);
  }

  // ----- Carte -----
  const hasMap = typeof L !== "undefined";
  let map = null, routeGroup = null, routeBounds = null, meMarker = null, meCircle = null;
  let follow = false, centered = false;

  if (hasMap) {
    map = L.map("map", { zoomControl: false }).setView([48.8566, 2.3522], 11);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    map.on("dragstart", () => setFollow(false));
    setTimeout(() => map.invalidateSize(), 200);
    window.addEventListener("resize", () => map.invalidateSize());
    window.addEventListener("orientationchange", () => setTimeout(() => map.invalidateSize(), 300));
  } else {
    $("#map").textContent = "Carte indisponible (connexion).";
  }

  function pinIcon(role) {
    return L.divIcon({ className: "", html: '<div class="pin ' + role + '">' + PIN[role] + "</div>",
                       iconSize: [30, 30], iconAnchor: [15, 15] });
  }
  function clearMap() {
    if (routeGroup) { routeGroup.remove(); routeGroup = null; }
    routeBounds = null;
    $("#info").hidden = true;
  }
  function fitRoute() {
    if (hasMap && routeBounds) {
      map.fitBounds(routeBounds, { paddingTopLeft: [40, 70], paddingBottomRight: [40, 140] });
    }
  }
  function showMap(m) {
    if (!hasMap || !m || !m.line || !m.line.length) return;
    clearMap();
    routeGroup = L.layerGroup().addTo(map);
    L.polyline(m.line, { color: "#ffffff", weight: 10, opacity: 0.95, lineCap: "round" }).addTo(routeGroup);
    const line = L.polyline(m.line, { color: "#2563eb", weight: 6, lineCap: "round" }).addTo(routeGroup);
    for (const p of m.points || []) {
      const mk = L.marker([p.lat, p.lon], { icon: pinIcon(p.role) }).addTo(routeGroup);
      const tip = document.createElement("div");
      tip.textContent = p.name;              // texte brut (les noms viennent d'OpenStreetMap)
      mk.bindTooltip(tip);
    }
    routeBounds = line.getBounds();
    setFollow(false);
    fitRoute();
    const stop = (m.points || []).find((p) => p.role === "stop");
    $("#info").textContent = m.duration_min + " min · " + m.distance_km + " km" + (stop ? " · via " + stop.name : "");
    $("#info").hidden = false;
  }
  function updateMe() {
    if (!hasMap || !gps) return;
    const ll = [gps.lat, gps.lon];
    if (!meMarker) {
      meCircle = L.circle(ll, { radius: gps.acc || 30, color: "#3b82f6", weight: 1, fillOpacity: 0.12 }).addTo(map);
      meMarker = L.circleMarker(ll, { radius: 8, color: "#fff", weight: 3, fillColor: "#2563eb", fillOpacity: 1 }).addTo(map);
    } else {
      meMarker.setLatLng(ll); meCircle.setLatLng(ll); meCircle.setRadius(gps.acc || 30);
    }
    if (follow) map.setView(ll, Math.max(map.getZoom(), 16));
    else if (!centered && !routeBounds) { map.setView(ll, 14); centered = true; }
  }
  function setFollow(on) {
    follow = on;
    $("#follow").classList.toggle("on", on);
    if (on && gps) updateMe();
  }

  function showLinks(l) {
    linksEl.innerHTML = "";
    const head = document.createElement("div");
    head.className = "lhead";
    const t = document.createElement("span");
    t.textContent = l.titre;
    const x = document.createElement("button");
    x.type = "button"; x.textContent = "✕"; x.setAttribute("aria-label", "Fermer");
    x.addEventListener("click", () => { linksEl.innerHTML = ""; });
    head.append(t, x);
    const row = document.createElement("div");
    row.className = "lrow";
    for (const [label, url] of [["Plans", l.apple_plans], ["Google Maps", l.google_maps]]) {
      if (!url) continue;
      const a = document.createElement("a");
      a.className = "btn"; a.href = url; a.textContent = "Ouvrir dans " + label;
      a.target = "_blank"; a.rel = "noopener";
      row.append(a);
    }
    linksEl.append(head, row);
  }

  // iOS n'autorise le son qu'après un geste : on "débloque" au premier toucher
  function unlockAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    if (!unlocked) {
      player.src = SILENT;
      player.play().then(() => { unlocked = true; }).catch(() => {});
    }
  }
  function startGps() {
    if (!navigator.geolocation || watchId !== null) return;
    watchId = navigator.geolocation.watchPosition(
      (p) => {
        gps = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
        $("#gps").textContent = "GPS ✓"; $("#gps").className = "ok";
        updateMe();
      },
      () => { gps = null; $("#gps").textContent = "GPS ✗"; $("#gps").className = ""; },
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  }

  // ----- Lecture audio en file d'attente -----
  function playData(b64) {
    return new Promise((resolve) => {
      const done = () => { player.onended = player.onerror = null; resolve(); };
      player.onended = player.onerror = done;
      player.src = "data:audio/wav;base64," + b64;
      player.play().catch(done);
    });
  }
  function enqueue(b64) { if (b64) chain = chain.then(() => playData(b64)); }
  function interrupt() {
    turnId++;
    if (abortCtl) abortCtl.abort();
    player.pause();
    chain = Promise.resolve();
  }

  // ----- Enregistrement avec détection de fin de phrase -----
  function pickMime() {
    for (const m of ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"]) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    }
    return "";
  }
  async function startRecording() {
    if (state === "recording" || state === "processing") return;
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (e) {
      say("sys", "Micro indisponible : autorise-le (Réglages > Safari > Microphone) et vérifie que l'adresse est en https.");
      setState("idle");
      return;
    }
    ended = false;
    const mime = pickMime();
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    const chunks = [];
    let timer = null, source = null, analyser = null, buf = null;
    let noiseSum = 0, noiseN = 0, speaking = false, lastVoice = 0, cancelled = false;
    const t0 = performance.now();

    if (audioCtx) {
      source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      source.connect(analyser);
      buf = new Uint8Array(analyser.fftSize);
    }
    const stop = () => { if (mr.state !== "inactive") mr.stop(); };
    rec = { stop };

    if (analyser) {
      timer = setInterval(() => {
        analyser.getByteTimeDomainData(buf);
        let s = 0;
        for (const v of buf) { const x = (v - 128) / 128; s += x * x; }
        const rms = Math.sqrt(s / buf.length);
        const now = performance.now();
        if (now - t0 < 300) { noiseSum += rms; noiseN++; return; }   // bruit ambiant
        const noise = noiseN ? noiseSum / noiseN : 0.01;
        if (rms > Math.max(0.04, noise * 2.5)) { speaking = true; lastVoice = now; }
        if (speaking && now - lastVoice > SILENCE_MS) stop();
        else if (!speaking && now - t0 > NO_SPEECH_MS) { cancelled = true; stop(); }
        else if (now - t0 > MAX_MS) stop();
      }, 50);
    }

    mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      if (timer) clearInterval(timer);
      if (source) source.disconnect();
      stream.getTracks().forEach((t) => t.stop());
      rec = null;
      const blob = new Blob(chunks, { type: mr.mimeType || mime || "audio/mp4" });
      if (cancelled || blob.size < 1500) {
        setState("idle");
        say("sys", "Je n'ai rien entendu.");
        return;
      }
      sendAudio(blob);
    };
    mr.start();
    setState("recording");
  }

  // ----- Échange avec le serveur -----
  function addPosition(fd) { if (gps) { fd.append("lat", gps.lat); fd.append("lon", gps.lon); } }
  function sendAudio(blob) {
    const fd = new FormData();
    fd.append("audio", blob, "voice." + (blob.type.includes("mp4") ? "mp4" : "webm"));
    addPosition(fd);
    runTurn("/api/turn", fd);
  }
  function onEvent(ev) {
    if (ev.type === "heard") say("user", ev.text);
    else if (ev.type === "empty") say("sys", "Je n'ai pas entendu, réessaie.");
    else if (ev.type === "filler") { setState("speaking"); enqueue(ev.audio); }
    else if (ev.type === "reply") {
      say("bot", ev.text);
      if (ev.links) { showLinks(ev.links); showMap(ev.links.map); }
      if (ev.end) ended = true;
      setState("speaking");
      enqueue(ev.audio);
    }
    else if (ev.type === "error") say("sys", "Erreur : " + ev.text);
  }
  async function readEvents(res, my) {
    const handle = (line) => { if (line.trim() && my === turnId) onEvent(JSON.parse(line)); };
    if (!res.body || !res.body.getReader) { (await res.text()).split("\n").forEach(handle); return; }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) { handle(buf.slice(0, i)); buf = buf.slice(i + 1); }
    }
    handle(buf);
  }
  async function runTurn(url, body) {
    const my = ++turnId;
    abortCtl = new AbortController();
    setState("processing");
    try {
      const res = await fetch(url, { method: "POST", body, credentials: "same-origin", signal: abortCtl.signal });
      if (res.status === 401) { location.reload(); return; }   // session expirée : retour à l'écran du code
      if (!res.ok) throw new Error("HTTP " + res.status);
      await readEvents(res, my);
      await chain;                       // on attend la fin de la lecture audio
    } catch (e) {
      if (e.name === "AbortError" || my !== turnId) return;
      say("sys", "Erreur de connexion : " + e.message);
      setState("idle");
      return;
    }
    if (my !== turnId) return;
    setState("idle");
    if (ended) { say("sys", "Conversation terminée."); return; }
    if ($("#hf").checked) setTimeout(() => { if (state === "idle") startRecording(); }, 500);
  }

  // ----- Historique des trajets -----
  async function loadHistory() {
    try {
      const res = await fetch("/api/history", { credentials: "same-origin" });
      if (res.status === 401) { location.reload(); return; }
      const data = await res.json();
      const items = data.items || [];
      const list = $("#histlist");
      list.innerHTML = "";
      for (const it of items) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "hitem";
        b.textContent = it.destination + (it.stop ? " · via " + it.stop : "");
        b.addEventListener("click", () => {
          unlockAudio(); startGps();
          if (state === "processing" || state === "recording") return;
          if (state === "speaking") interrupt();
          $("#options").hidden = true;
          const fd = new FormData();
          fd.append("text", "Emmène-moi à " + it.destination);
          addPosition(fd);
          runTurn("/api/text", fd);
        });
        list.append(b);
      }
      $("#hist").hidden = items.length === 0;
    } catch (e) {}
  }
  $("#histclear").addEventListener("click", async () => {
    if (!confirm("Effacer tout l'historique ?")) return;
    try { await fetch("/api/history/clear", { method: "POST", credentials: "same-origin" }); } catch (e) {}
    loadHistory();
  });

  // ----- Interactions -----
  mic.addEventListener("click", () => {
    unlockAudio(); startGps();
    if (state === "recording") { if (rec) rec.stop(); return; }
    if (state === "processing") return;
    if (state === "speaking") interrupt();
    startRecording();
  });
  $("#optbtn").addEventListener("click", () => {
    $("#options").hidden = !$("#options").hidden;
    if (!$("#options").hidden) loadHistory();
    if (hasMap) setTimeout(() => map.invalidateSize(), 50);
  });
  $("#fit").addEventListener("click", () => { setFollow(false); fitRoute(); });
  $("#follow").addEventListener("click", () => {
    if (!gps) { say("sys", "Position GPS indisponible pour l'instant."); return; }
    setFollow(!follow);
  });
  $("#tf").addEventListener("submit", (e) => {
    e.preventDefault();
    unlockAudio(); startGps();
    const v = $("#ti").value.trim();
    if (!v || state === "processing" || state === "recording") return;
    if (state === "speaking") interrupt();
    $("#ti").value = "";
    const fd = new FormData();
    fd.append("text", v);
    addPosition(fd);
    runTurn("/api/text", fd);
  });
  $("#reset").addEventListener("click", async () => {
    interrupt(); setState("idle");
    try { await fetch("/api/reset", { method: "POST", credentials: "same-origin" }); } catch (e) {}
    logEl.innerHTML = ""; linksEl.innerHTML = ""; clearMap();
    say("sys", "Nouvelle conversation. Appuie sur le bouton et dis où tu vas.");
  });

  setState("idle");
  startGps();
  say("sys", "Appuie sur le bouton et dis-moi où tu vas.");
})();
</script>
</body>
</html>
